name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      # A stale TypeScript build cache once produced a package holding the icons but not the
      # compiled node, which n8n then refused to load. This fails the build instead.
      - name: Check the package holds the compiled node and credential
        run: |
          test -f dist/nodes/NesikaCommerce/NesikaCommerce.node.js
          test -f dist/credentials/NesikaCommerceApi.credentials.js
